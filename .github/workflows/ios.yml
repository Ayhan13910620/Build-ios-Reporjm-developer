name: iOS Build Environment

'on':
workflow_dispatch:

jobs:
ios:
runs-on: macos-15
timeout-minutes: 10000
steps:
- name: Check macOS and Xcode
run: sw_vers
- name: Check Xcode version
    run: xcodebuild -version

  - name: Check iOS SDK
    run: xcodebuild -showsdks

  - name: Check Swift
    run: swift --version
