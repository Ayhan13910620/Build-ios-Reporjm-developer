name: iOS Build Environment

'on':
workflow_dispatch:

jobs:
ios:
runs-on: macos-15
timeout-minutes: 10000

steps:
  - name: Check macOS and Xcode
    run: |
      sw_vers
      xcodebuild -version
      xcodebuild -showsdks

  - name: Check iOS build tools
    run: |
      xcrun --find simctl
      xcrun simctl list devices available

  - name: Check Swift
    run: swift --version
